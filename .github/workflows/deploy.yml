# Deploys to Vercel on every push to main. GitHub and Vercel are separate accounts,
# so this uses a Vercel access token (repo secret VERCEL_TOKEN) instead of the Vercel GitHub app.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_eA3dzyNn9zRd17OX8z44PTJY
      VERCEL_PROJECT_ID: prj_feQAUvO4z4EEic98Qsoxd3EUMfE0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
